<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Webpage with AdSense and CSE</title>
  <!-- Meta tag for AdSense account -->
  <meta name="google-adsense-account" content="ca-pub-4985140418471415" />
<script async custom-element="amp-auto-ads"
        src="https://cdn.ampproject.org/v0/amp-auto-ads-0.1.js">
</script>
  <!-- AdSense script with client ID -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4985140418471415"
     crossorigin="anonymous"></script>

  <!-- Google CSE script -->
  <script async src="https://cse.google.com/cse.js?cx=e6808899c3fc44d83"></script>
  <script async custom-element="amp-ad" src="https://cdn.ampproject.org/v0/amp-ad-0.1.js"></script>
</head>
<body>
<amp-auto-ads type="adsense"
        data-ad-client="ca-pub-4985140418471415">
</amp-auto-ads>
  <amp-ad width="100vw" height="320"
     type="adsense"
     data-ad-client="ca-pub-4985140418471415"
     data-ad-slot="3537489904"
     data-auto-format="rspv"
     data-full-width="">
  <div overflow=""></div>
</amp-ad>
  <h1>Welcome to My Website</h1>
  <p>This is some content on my page.</p>

  <!-- AdSense Ad -->
  <div style="margin: 20px 0;">
    <!-- Example Ad Unit -->
    <ins class="adsbygoogle"
         style="display:block; width:300px; height:250px;"
         data-ad-client="ca-pub-4985140418471415"
         data-ad-slot="1234567890"></ins>
    <script>
      (adsbygoogle = window.adsbygoogle || []).push({});
    </script>
  </div>

  <!-- Google Custom Search -->
  <div class="gcse-search"></div>


  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4985140418471415"
     crossorigin="anonymous"></script>
<!-- display ad unit -->
<ins class="adsbygoogle"
     style="display:block"
     data-ad-client="ca-pub-4985140418471415"
     data-ad-slot="3537489904"
     data-ad-format="auto"
     data-full-width-responsive="true"></ins>
<script>
     (adsbygoogle = window.adsbygoogle || []).push({});
</script>
</body>
</html>
