<style>

/* RESET */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Montserrat',sans-serif;
  background:url('https://i.pinimg.com/originals/74/43/a3/7443a31b6a19e5630b94a6538ff9bdd1.gif') no-repeat center fixed;
  background-size:cover;
  color:#111;
}

/* NAVBAR */
#navbar{
  width:100%;
  height:120px;
  position:fixed;
  top:0;
  left:0;
  z-index:999;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:20px;

  background:rgba(0,0,0,.6);
  border-bottom:3px solid #f705d6;
  backdrop-filter:blur(8px);
}

#navbar a{
  color:#fff;
  text-decoration:none;
  font-weight:700;
  padding:10px 14px;
  transition:.3s;
}

#navbar a:hover{
  color:#f705d6;
}

.logo{
  height:70px;
}

/* MAIN */
#data{
  max-width:1100px;
  margin:160px auto 60px;
  padding:30px;
  background:#fff;
  border-radius:20px;
  box-shadow:0 20px 50px rgba(0,0,0,.2);
  text-align:center;
}

/* TITLES */
h2{
  font-size:2.5rem;
  text-transform:uppercase;
  letter-spacing:3px;
}

h3{
  color:#f705d6;
  margin-top:10px;
  letter-spacing:3px;
}

/* MEDIA */
iframe{
  width:100%;
  max-width:700px;
  height:400px;
  margin:20px auto;
  border:none;
  border-radius:15px;
  display:block;
}

img{
  width:100%;
  max-width:700px;
  margin:20px auto;
  border-radius:15px;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
  display:block;
  transition:.3s;
}

img:hover{
  transform:translateY(-5px);
}

/* QUOTE */
blockquote{
  margin:30px auto;
  max-width:700px;
  background:#111;
  color:#fff;
  padding:20px;
  border-left:5px solid #f705d6;
  border-radius:12px;
}

/* LINKS */
.links a{
  color:#f705d6;
  font-weight:700;
  margin:0 8px;
  text-decoration:none;
}

.links a:hover{
  color:#111;
}

/* FOOTER */
footer{
  background:#111;
  color:#fff;
  padding:30px;
  text-align:center;
  border-top:3px solid #f705d6;
}

/* MOBILE */
@media(max-width:768px){
  iframe{
    height:250px;
  }

  h2{
    font-size:1.8rem;
  }

  #navbar{
    flex-wrap:wrap;
    height:auto;
    padding:10px;
  }
}

</style>
