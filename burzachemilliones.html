<html lang="en">

<style>
   

.nav-links a:hover{
  color:var(--pink);
}

/* HERO */
.hero{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:120px 20px;
 
}

.hero h1{
  font-size:4rem;
  font-weight:900;
  letter-spacing:4px;
  text-transform:uppercase;
  background:linear-gradient(90deg,var(--pink),var(--pink2));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.hero p{
  max-width:650px;
  margin-top:20px;
  color:var(--muted);
  font-size:1.1rem;
  line-height:1.6;
}

/* BUTTON */
.btn{
  margin-top:35px;
  padding:14px 40px;
  border:1px solid var(--pink);
  color:white;
  text-decoration:none;
  border-radius:50px;
  letter-spacing:2px;
  text-transform:uppercase;
  transition:.3s;
  box-shadow:0 0 20px rgba(255,46,99,.2);
}

.btn:hover{
  background:var(--pink);
  transform:translateY(-3px);
  box-shadow:0 0 40px rgba(255,46,99,.5);
}

/* CARD SECTION */
.section{
  padding:80px 20px;
  max-width:1100px;
  margin:auto;
}

.section h2{
  text-align:center;
  font-size:2.5rem;
  margin-bottom:40px;
  letter-spacing:3px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:25px;
}

.card{
  background:var(--card);
  border:1px solid rgba(255,255,255,.08);
  border-radius:18px;
  padding:25px;
  transition:.3s;
  position:relative;
  overflow:hidden;
}

.card:hover{
  transform:translateY(-10px);
  border-color:var(--pink);
  box-shadow:0 10px 40px rgba(255,46,99,.15);
}

.card h3{
  margin-bottom:10px;
  color:var(--pink);
  letter-spacing:2px;
}

.card p{
  color:var(--muted);
  font-size:.9rem;
}

/* SLIDESHOW */
.slideshow{
  margin-top:50px;
  width:300px;
  height:300px;
  position:relative;
}

.slideshow img{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:contain;
  opacity:0;
  animation:fade 8s infinite;
}

.slideshow img:nth-child(1){animation-delay:0s;}
.slideshow img:nth-child(2){animation-delay:2s;}
.slideshow img:nth-child(3){animation-delay:4s;}
.slideshow img:nth-child(4){animation-delay:6s;}

@keyframes fade{
  0%{opacity:0;}
  10%{opacity:1;}
  25%{opacity:1;}
  35%{opacity:0;}
  100%{opacity:0;}
}

/* FOOTER */
footer{
  padding:50px 20px;
  text-align:center;
  color:var(--muted);
  border-top:1px solid rgba(255,255,255,.08);
  margin-top:80px;
}

 
#slideshow {
      position: relative;
      width: 300px;
      height: 300px;
      margin: 30px auto;
      overflow: hidden;
    }

.slide-image {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }

.slide-image:nth-child(1) { animation: fade 4s infinite; }
.slide-image:nth-child(2) { animation: fade 4s infinite 1s; }
.slide-image:nth-child(3) { animation: fade 4s infinite 2s; }
.slide-image:nth-child(4) { animation: fade 4s infinite 3s; }

@keyframes fade {
      0%, 25% { opacity: 0; }
      12.5%, 12.5% { opacity: 1; }
      100% { opacity: 0; }
    }
 
:root{
  --bg:#05070d;
  --blue:#2f7bff;
  --blue2:#00d4ff;
  --card:#0b1220;
  --text:#ffffff;
  --muted:#9bb0c9;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter',sans-serif;
}

body{
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
}

/* ================= LOADING SCREEN ================= */
 

.glitch{
  font-size:2rem;
  font-weight:900;
  letter-spacing:4px;
  color:var(--blue);
  animation:glitch 1s infinite;
}

@keyframes glitch{
  0%{transform:translate(0);}
  20%{transform:translate(-2px,2px);}
  40%{transform:translate(2px,-2px);}
  60%{transform:translate(-1px,1px);}
  80%{transform:translate(1px,-1px);}
  100%{transform:translate(0);}
}

/* ================= NAV ================= */
header{
  position:fixed;
  top:0;
  width:100%;
  z-index:9999;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 30px;
  background:rgba(0,0,0,.5);
  backdrop-filter:blur(15px);
  border-bottom:1px solid rgba(255,255,255,.08);
}

.logo{
  font-weight:900;
  letter-spacing:3px;
  color:var(--blue);
  text-decoration:none;
}

nav{
  display:flex;
  gap:20px;
}

nav a{
  color:white;
  text-decoration:none;
  font-size:.8rem;
  letter-spacing:2px;
  text-transform:uppercase;
}

nav a:hover{
  color:var(--blue2);
}

/* ================= HERO VIDEO ================= */
.hero{
  height:100vh;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  overflow:hidden;
}

.hero video{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:-2;
  filter:brightness(.4);
}

.hero h1{
  font-size:4rem;
  font-weight:900;
  letter-spacing:4px;
  background:linear-gradient(90deg,var(--blue),var(--blue2));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.hero p{
  max-width:700px;
  margin-top:20px;
  color:var(--muted);
}

.btn{

  padding:14px 40px;
  border:1px solid var(--blue);
  border-radius:50px;
  color:white;
  text-decoration:none;
  transition:.3s;
}

.btn:hover{
  background:var(--blue);
  box-shadow:0 0 30px rgba(47,123,255,.6);
}

/* ================= SECTIONS ================= */
section{
  padding:100px 20px;
  max-width:1100px;
  margin:auto;
}

.title{
  text-align:center;
  font-size:2.5rem;
  font-weight:900;
  margin-bottom:40px;
}

/* ================= MUSIC PLAYER ================= */
.player{
  background:var(--card);
  border:1px solid rgba(255,255,255,.1);
  border-radius:20px;
  padding:20px;
  text-align:center;
}

audio{
  width:100%;
  margin-top:10px;
}

/* ================= SHOP ================= */
.shop{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
}

.product{
  background:var(--card);
  border:1px solid rgba(255,255,255,.1);
  border-radius:18px;
  padding:20px;
  transition:.3s;
}

.product:hover{
  transform:translateY(-10px);
  border-color:var(--blue);
}

.product h3{
  color:var(--blue);
}

.price{
  color:var(--muted);
  margin:10px 0;
}

.buy{
  display:inline-block;
  padding:10px 20px;
  border:1px solid var(--blue);
  border-radius:30px;
  color:white;
  text-decoration:none;
}

/* ================= FOOTER ================= */
footer{
  padding:50px 20px;
  text-align:center;
  color:var(--muted);
  border-top:1px solid rgba(255,255,255,.08);
}
