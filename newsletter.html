<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>placosostudio.com - Newsletter Signup</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .form-container {
      background-color: #fff;
      padding: 30px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      border-radius: 8px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    form {
      display: flex;
      flex-direction: column;
    }

    label {
      margin-bottom: 8px;
      font-weight: bold;
      color: #555;
    }

    input[type="text"],
    input[type="email"],
    textarea {
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1em;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    textarea:focus {
      border-color: #007BFF;
      outline: none;
    }

    button {
      padding: 12px;
      background-color: #007BFF;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 1em;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #0056b3;
    }

    /* Optional: success message style */
    .success-message {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background-color: #d4edda;
      color: #155724;
      border-radius: 4px;
      border: 1px solid #c3e6cb;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Subscribe to Our Newsletter</h2>
    <!-- Google Form for newsletter signup -->
    <form action="https://docs.google.com/forms/u/0/d/e/1FAIpQLScTlkkMYCyx19rgtlWlzsAt-Jb6AuAZv73L0q2JZReXgFYXbQ/formResponse" target="_self" method="POST" id="newsletterForm">
      <!-- Name -->
      <label for="entry.1974726301">Name</label>
      <input type="text" name="entry.1974726301" id="name" placeholder="Your Name" required />

      <!-- Email -->
      <label for="entry.329226581">Email *</label>
      <input type="email" name="entry.329226581" id="email" placeholder="you@example.com" required />

      <!-- Optional message or questions -->
      <label for="entry.1718421104">Questions or Comments</label>
      <textarea name="entry.1718421104" id="comments" rows="4" placeholder="Your message..."></textarea>

      <!-- Submit Button -->
      <button type="submit">Subscribe</button>
    </form>
    <div class="success-message" id="successMessage">Thank you for subscribing!</div>
  </div>

  <script>
    // Optional: Show success message after submission
    document.getElementById('newsletterForm').addEventListener('submit', function(e) {
      e.preventDefault(); // Prevent default form submission to handle via AJAX if needed

      // You can implement AJAX here for better UX
      // For now, just submit the form normally
      this.submit();

      // Show success message
      document.getElementById('successMessage').style.display = 'block';

      // Optional: reset form
      this.reset();
    });
  </script>
</body>
</html>
