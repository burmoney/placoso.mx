<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Placoso Studio | Contact</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#050505;
  --card:#0d0d0d;
  --pink:#ff2e63;
  --pink2:#ff4d7d;
  --text:#ffffff;
  --muted:#b8b8b8;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter',sans-serif;
}

body{
  background:var(--bg);
  color:var(--text);
}

/* ================= NAVBAR ================= */
header{
  position:fixed;
  top:0;
  width:100%;
  z-index:9999;

  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:15px 30px;

  background:rgba(0,0,0,.6);
  backdrop-filter:blur(15px);
  border-bottom:1px solid rgba(255,255,255,.08);
}

.logo-container img{
  height:70px;
  filter:drop-shadow(0 0 10px rgba(255,46,99,.4));
}

nav ul{
  list-style:none;
  display:flex;
  gap:25px;
  align-items:center;
}

.nav-link{
  color:white;
  text-decoration:none;
  font-size:.85rem;
  letter-spacing:2px;
  text-transform:uppercase;
  transition:.3s;
}

.nav-link:hover{
  color:var(--pink);
}

/* dropdown */
.nav-item{
  position:relative;
}

.dropdown-menu{
  position:absolute;
  top:100%;
  left:0;
  background:#0d0d0d;
  border:1px solid rgba(255,255,255,.08);
  min-width:180px;
  display:none;
  flex-direction:column;
}

.dropdown-menu.show{
  display:flex;
}

.dropdown-menu a{
  padding:10px 15px;
  color:white;
  text-decoration:none;
  font-size:.8rem;
}

.dropdown-menu a:hover{
  background:rgba(255,46,99,.1);
}

/* ================= MAIN ================= */
main{
  padding-top:140px;
  max-width:1100px;
  margin:auto;
  text-align:center;
}

h2{
  font-size:3rem;
  font-weight:900;
  letter-spacing:3px;
  background:linear-gradient(90deg,var(--pink),var(--pink2));
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

p{
  color:var(--muted);
  margin-top:10px;
}

/* CONTENT BLOCKS */
section{
  padding:40px 20px;
}

/* VIDEOS */
iframe{
  width:100%;
  max-width:600px;
  height:340px;
  margin:15px auto;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.08);
}

/* IMAGES */
img{
  max-width:100%;
  border-radius:12px;
  margin:15px 0;
  border:1px solid rgba(255,255,255,.08);
}

/* QUOTE */
blockquote{
  margin-top:10px;
  color:var(--pink);
  font-style:italic;
}

/* LINKS */
a{
  color:var(--pink);
  text-decoration:none;
  margin:0 8px;
}

a:hover{
  text-decoration:underline;
}

/* FOOTER */
footer{
  margin-top:60px;
  padding:40px 20px;
  text-align:center;
  color:var(--muted);
  border-top:1px solid rgba(255,255,255,.08);
}
</style>
</head>

<body>

<header>

  <div class="logo-container">
    <a href="/">
      <img src="images/logo.png" alt="Placoso Studio">
    </a>
  </div>

  <nav>
    <ul>
      <li class="nav-item">
        <a href="/" class="nav-link">Inicio</a>
      </li>

      <li class="nav-item">
        <a href="#" class="nav-link" onclick="toggleDropdown(event)">Colecciones ▼</a>

        <div class="dropdown-menu">
          <a href="#">Clásico</a>
          <a href="/product1">Product 1</a>
          <a href="/product2">Product 2</a>
          <a href="/product3">Product 3</a>
        </div>
      </li>

      <li><a href="/contact" class="nav-link">Contacto</a></li>
    </ul>
  </nav>

</header>

<main>

  <section>
    <h2>PLACOSO PERO NO MALO</h2>
    <p>HECHO A MANO — CYBER STREET IDENTITY</p>
  </section>

  <section>
    <iframe src="https://www.youtube.com/embed/pJAjiLdtSOE" allowfullscreen></iframe>
    <iframe src="https://www.youtube.com/embed/YBgggjfDVng" allowfullscreen></iframe>
  </section>

  <section>
    <img src="https://scontent.fmex11-1.fna.fbcdn.net/v/t1.0-9/25398841_1767190980021556_2526742297920042431_n.jpg" />
    <img src="https://i.pinimg.com/originals/14/92/d6/1492d613d333c1a3465dd8f8dcf84b74.gif" />
  </section>

  <section>
    <p style="font-size:1.3rem;">
      "Can't you see, we all stuck in the same system!"
    </p>
    <blockquote>- Burzache Milliones</blockquote>
  </section>

  <section>
    <a href="https://www.youtube.com/channel/UCPthqEpbaFfblf2DXywLrzA">YouTube</a>
    <a href="https://offtop.co/u/IKci15UCbD">OffTop</a>
    <a href="https://soundcloud.com/burzache-milliones">SoundCloud</a>
    <a href="http://www.witchipedia.com/zodiac:virgo">Virgo</a>
  </section>

</main>

<footer>
  © 2026 Placoso Studio — Cyber Streetwear Identity
</footer>

<script>
function toggleDropdown(e){
  e.preventDefault();
  const menu = e.target.nextElementSibling;
  if(menu){
    menu.classList.toggle('show');
  }
}
</script>

</body>
</html>
